server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fotos de até 10 MB (o backend também limita: UPLOAD_MAX_FILE_SIZE).
  client_max_body_size 11m;

  # Toda a API, inclusive o logout (/api/auth/logout), fica sob /api.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O upload espera a análise da IA (Gemini), que pode levar dezenas de segundos.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location / {
    # As fotos ficam no Cloudinary: img-src precisa liberar res.cloudinary.com.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
  }
}
