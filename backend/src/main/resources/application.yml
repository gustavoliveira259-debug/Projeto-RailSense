spring:
  application:
    name: railsense

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:railsense_db}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:11MB}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: RAILSENSE_SESSION
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:strict}
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # Usuários são criados pelo ADMIN; desligue em produção para fechar o /api/auth/register.
    registration-enabled: ${REGISTRATION_ENABLED:true}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrador RailSense}
  cloudinary:
    url: ${CLOUDINARY_URL}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
