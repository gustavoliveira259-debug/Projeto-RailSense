
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8

; Mesmo firmware sem Wi-Fi: as leituras saem pela USB e hardware/serial_bridge.py publica no MQTT.
; Gravar: pio run -e esp32dev-usb -t upload
[env:esp32dev-usb]
extends = env:esp32dev
build_flags = -D RAILSENSE_USB
