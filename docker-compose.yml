services:

  postgres:
    image: postgres:16
    container_name: monitoramento-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: monitoramento-backend
    restart: always
    depends_on:
      - postgres
      - broker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador RailSense}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-strict}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Leituras de vibração do ESP32 (railsense/sensor/vibracao).
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://broker:1883}
      MQTT_USUARIO: backend
      MQTT_SENHA: ${MQTT_BACKEND_SENHA}
    ports:
      - "8080:8080"

  broker:
    image: eclipse-mosquitto:2
    container_name: monitoramento-broker
    restart: always
    # Gera as senhas a partir do .env antes de subir (sem acesso anônimo).
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_ESP32_SENHA: ${MQTT_ESP32_SENHA}
      MQTT_BACKEND_SENHA: ${MQTT_BACKEND_SENHA}
      MQTT_CAMERA_SENHA: ${MQTT_CAMERA_SENHA}
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - ./broker/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data

  frontend:
    build:
      context: ./frontend
    container_name: monitoramento-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  mosquitto_data:

