# Blueprint do Render para o backend. Passo a passo em backend/DEPLOY.md.
# Variáveis com "sync: false" são segredos: o Render pede o valor na criação e não lê deste arquivo.
services:
  - type: web
    name: railsense-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    # Só redeploya quando algo do backend muda.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Supabase: use a string do "Session pooler" (porta 5432), não a conexão direta (só IPv6).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # URL do frontend no Vercel, ex.: https://railsense.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_NAME
        value: Administrador RailSense
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # strict funciona porque o Vercel repassa /api para cá (mesma origem para o navegador).
      - key: SESSION_COOKIE_SAME_SITE
        value: strict
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
