listener 1883 0.0.0.0

# Sem acesso anônimo: a porta fica exposta na rede para a ESP32 alcançar, então
# qualquer aparelho da rede poderia injetar leituras e pedidos de captura.
# Usuários e senhas vêm do .env (broker/entrypoint.sh gera o arquivo de senhas).
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
